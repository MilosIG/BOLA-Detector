services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bola
      MYSQL_USER: bola
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-dev-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: src/BolaDetector.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: localhost
      ConnectionStrings__Default: Server=mysql;Database=bola;User=bola;Password=${MYSQL_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      mysql:
        condition: service_healthy
  target:
    build:
      context: .
      dockerfile: targets/BolaTestApi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "127.0.0.1:5081:8080"
volumes:
  mysql-data:
