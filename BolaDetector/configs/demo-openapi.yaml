openapi: 3.0.3
info:
  title: BOLA Test API
  version: 1.0.0
servers:
  - url: http://localhost:5081
paths:
  /vulnerable/documents/{id}:
    get:
      operationId: readVulnerableDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document returned without ownership check
  /secure/documents/{id}:
    get:
      operationId: readSecureDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Test-User
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Owner access
        '403':
          description: Access denied
